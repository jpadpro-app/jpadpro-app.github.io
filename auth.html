  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 400px; background: var(--card); border-radius: 22px; padding: 28px 24px 24px; text-align: center;
    box-shadow: 0 12px 36px rgba(16, 38, 66, 0.12); border: 1px solid var(--line); }
  .logo { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12); }
  .badge { width: 56px; height: 56px; margin: 18px auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); }
  .badge.err { background: linear-gradient(135deg, #d9534f, #f08a3e); }
  h1 { font-size: 22px; margin: 10px 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; }
  .btn { display: block; width: 100%; max-width: 280px; margin: 10px auto 0; padding: 14px 18px; border: 0; border-radius: 14px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700; line-height: 1.2; color: #fff; text-decoration: none; background: linear-gradient(120deg, var(--a1), var(--a2)); box-shadow: 0 6px 16px rgba(47, 179, 154, 0.3); }
  .btn.ghost { background: transparent; color: var(--a1); box-shadow: none; border: 1.5px solid color-mix(in srgb, var(--a1) 45%, transparent); }
  .btn[disabled] { opacity: 0.6; cursor: default; }
  input { display: block; width: 100%; max-width: 280px; margin: 8px auto; height: 48px; padding: 0 14px; border-radius: 12px; font-size: 16px;
    border: 1.5px solid var(--line); background: transparent; color: inherit; }
  .small { font-size: 13px; margin-top: 16px; }
  [hidden] { display: none !important; }
</style>
</head>

  <button class="btn" id="go" type="button">Verify email address</button>
  <a class="btn ghost" id="back" href="#" hidden>Return to JPadPro</a>
  <p class="small" id="note">If you didn’t ask for this, you can close this page.</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var mode = q.get('mode'), code = q.get('oobCode'), key = q.get('apiKey');
  var $ = function (id) { return document.getElementById(id); };
  var android = /Android/i.test(navigator.userAgent);
  function appLink(path, extra) {
    var qs = extra ? '?' + extra : '';
    return android ? 'intent://auth/' + path + qs + '#Intent;scheme=com.jpadpro.app;package=com.jpadpro.app;end' : 'com.jpadpro.app://auth/' + path + qs;
  }
  function show(t, x, ok) { $('title').textContent = t; $('text').textContent = x; $('badge').textContent = ok ? '✓' : '!'; $('badge').className = 'badge' + (ok ? '' : ' err'); }
  function api(method, body) {
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:' + method + '?key=' + encodeURIComponent(key),
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j.error && j.error.message) || 'ERROR'); return j; }); });
  }
  function fail(e) {
    var m = String(e && e.message || '');
    show('This link doesn’t work', /EXPIRED|INVALID_OOB/.test(m) ? 'The link has expired or was already used. Open JPadPro and request a new one.' : 'Something went wrong. Please try again from the JPadPro app.', false);
    $('go').hidden = true; $('pwBox').hidden = true; $('back').href = appLink('verified'); $('back').hidden = false;
  }
  if (!mode || !code || !key) { show('Link is not complete', 'Please open the link from the JPadPro email again.', false); $('go').hidden = true; return; }
  if (mode === 'verifyEmail') {
    $('go').onclick = function () {
      $('go').disabled = true; $('go').textContent = 'Verifying…';
      api('update', { oobCode: code }).then(function () {
        show('Your email has been verified', 'You can now sign in to JPadPro with this email.', true);
        $('go').hidden = true; $('back').href = appLink('verified'); $('back').hidden = false; $('back').className = 'btn'; $('note').hidden = true;
      }).catch(fail);
    };
  } else if (mode === 'resetPassword') {
    show('Reset your password', 'Enter a new password for your JPadPro account.', true); $('badge').textContent = '🔑';
    $('pwBox').hidden = false; $('go').textContent = 'Save new password';
    api('resetPassword', { oobCode: code }).then(function (j) { if (j.email) $('text').textContent = 'Enter a new password for ' + j.email + '.'; }).catch(fail);
    $('go').onclick = function () {
      var a = $('pw1').value, b = $('pw2').value;
      if (a.length < 6) { $('text').textContent = 'The password must be at least 6 characters.'; return; }
      if (a !== b) { $('text').textContent = 'The passwords don’t match.'; return; }
      $('go').disabled = true;
      api('resetPassword', { oobCode: code, newPassword: a }).then(function () {
        show('Password changed', 'You can now sign in to JPadPro with your new password.', true);
        $('pwBox').hidden = true; $('go').hidden = true; $('back').href = appLink('verified'); $('back').hidden = false; $('back').className = 'btn'; $('note').hidden = true;
      }).catch(fail);
    };
  } else if (mode === 'signIn') {
    show('Finish creating your account', 'Tap the button to open JPadPro and finish.', true); $('badge').textContent = '✉';
    var url = appLink('email', 'oobCode=' + encodeURIComponent(code) + '&mode=signIn');
    $('go').hidden = true; $('back').href = url; $('back').hidden = false; $('back').className = 'btn'; $('back').textContent = 'Open JPadPro';
    $('note').textContent = 'Open this link on the phone where you tapped “Create account”. If you didn’t ask for this, ignore the email — no account is created.';
    if (android) setTimeout(function () { location.href = url; }, 300);
  } else {
    show('Done', 'You can return to JPadPro.', true); $('go').hidden = true; $('back').href = appLink('verified'); $('back').hidden = false; $('back').className = 'btn';
  }
})();
</script>
</body>
</html>
